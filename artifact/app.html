<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arzuman Brothers, call center demo v1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --n0:#FFFFFF; --n25:#F9FBFA; --n50:#F1F5F3; --n100:#E6ECE9; --n200:#D5DDD9; --n300:#BAC5C0; --n500:#7B8782; --n600:#55625C; --n900:#131A17;
  --g25:#F3FAF6; --g50:#E7F4EC; --g100:#CFEADA; --g200:#A4D6B9; --g400:#48AE79; --g500:#1E8A55; --g600:#157246; --g700:#0E5734;
  --a25:#FFFBF1; --a50:#FFF4D9; --a100:#FEE8AE; --a300:#FACD5C; --a400:#F7B917; --a500:#E2A200; --a700:#8A6000; --a900:#382700;
  --r25:#FFF7F6; --r50:#FEEFED; --r100:#FBD8D3; --r500:#D53B2D; --r700:#9F2519;
  --b25:#F6F9FF; --b50:#ECF2FE; --b100:#D9E5FD; --b500:#3470E4; --b700:#2150B5;
  --v25:#F8F6FF; --v50:#F0ECFE; --v100:#DFD7FC; --v500:#6B54D6;
  --on-g:#FFFFFF; --bg:var(--n50); --surface:var(--n0); --ink:var(--n900); --muted:var(--n600); --faint:var(--n500); --line:var(--n100); --line-2:var(--n200);
  --sh-1:0 1px 2px rgba(19,26,23,.05), 0 1px 4px rgba(19,26,23,.04);
  --sh-2:0 14px 30px -12px rgba(19,26,23,.18), 0 3px 8px rgba(19,26,23,.05);
  --sh-3:0 40px 70px -24px rgba(19,26,23,.38), 0 10px 24px -10px rgba(19,26,23,.18);
  --f:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif; --ease:cubic-bezier(.2,.75,.2,1); color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --n0:#161D1A; --n25:#1A221F; --n50:#0E1311; --n100:#232C28; --n200:#303A35; --n300:#46514C; --n500:#7F8B86; --n600:#A8B3AE; --n900:#EEF2F0;
  --g25:#132019; --g50:#16291F; --g100:#1C3B2B; --g200:#26543B; --g400:#48B57C; --g500:#52C488; --g600:#72D49F; --g700:#A1E4BE;
  --a25:#1D1A10; --a50:#2A2211; --a100:#3D3113; --a300:#8A6A16; --a400:#B8901F; --a500:#D9A93A; --a700:#F4C75A; --a900:#FFF1CC;
  --r25:#221514; --r50:#2C1715; --r100:#3F1E1A; --r500:#F06B5D; --r700:#F59C92;
  --b25:#121A2A; --b50:#152036; --b100:#1C2C4A; --b500:#80A7F3; --b700:#AAC4F8; --v25:#1A1729; --v50:#211C38; --v100:#2E2752; --v500:#A996F6;
  --on-g:#0A1A11; --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 14px 30px -12px rgba(0,0,0,.6); --sh-3:0 40px 70px -24px rgba(0,0,0,.75); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --n0:#161D1A; --n25:#1A221F; --n50:#0E1311; --n100:#232C28; --n200:#303A35; --n300:#46514C; --n500:#7F8B86; --n600:#A8B3AE; --n900:#EEF2F0;
  --g25:#132019; --g50:#16291F; --g100:#1C3B2B; --g200:#26543B; --g400:#48B57C; --g500:#52C488; --g600:#72D49F; --g700:#A1E4BE;
  --a25:#1D1A10; --a50:#2A2211; --a100:#3D3113; --a300:#8A6A16; --a400:#B8901F; --a500:#D9A93A; --a700:#F4C75A; --a900:#FFF1CC;
  --r25:#221514; --r50:#2C1715; --r100:#3F1E1A; --r500:#F06B5D; --r700:#F59C92;
  --b25:#121A2A; --b50:#152036; --b100:#1C2C4A; --b500:#80A7F3; --b700:#AAC4F8; --v25:#1A1729; --v50:#211C38; --v100:#2E2752; --v500:#A996F6;
  --on-g:#0A1A11; --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 14px 30px -12px rgba(0,0,0,.6); --sh-3:0 40px 70px -24px rgba(0,0,0,.75); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%; margin:0}
body{font-family:var(--f); font-size:14.5px; line-height:1.45; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2.5px solid var(--b500); outline-offset:2px; border-radius:10px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-weight:700; letter-spacing:-.02em}
svg{flex-shrink:0}
[hidden]{display:none!important}
.tg{--t25:var(--g25); --t50:var(--g50); --t100:var(--g100); --t600:var(--g600)}
.ta{--t25:var(--a25); --t50:var(--a50); --t100:var(--a100); --t600:var(--a700)}
.tb{--t25:var(--b25); --t50:var(--b50); --t100:var(--b100); --t600:var(--b500)}
.tv{--t25:var(--v25); --t50:var(--v50); --t100:var(--v100); --t600:var(--v500)}
.tr{--t25:var(--r25); --t50:var(--r50); --t100:var(--r100); --t600:var(--r500)}

/* ===== Top bar ===== */
.shell{display:flex; flex-direction:column; height:100%}
.top{flex:none; position:relative; z-index:30; display:flex; align-items:center; gap:16px; height:64px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px; flex:none}
.mark{width:36px; height:36px; border-radius:12px; background:linear-gradient(145deg, var(--g500), var(--g600)); color:var(--on-g); display:grid; place-items:center}
.brand b{display:block; font-size:15.5px; font-weight:700; border-radius:7px; padding:1px 5px; margin-left:-5px; white-space:nowrap; outline:none}
.brand b[contenteditable="true"]{background:var(--n50); box-shadow:0 0 0 2px var(--b500)}
.brand small{display:block; color:var(--muted); font-size:12px}
.appsw{display:flex; gap:3px; padding:5px 4px 4px; border-radius:15px; background:var(--n50); border:1px solid var(--line); min-width:0; overflow-x:auto; scrollbar-width:none}
.sw-b{position:relative; display:flex; align-items:center; gap:7px; height:38px; padding:0 12px 0 5px; border-radius:11px; font-size:13.5px; font-weight:600; color:var(--muted); white-space:nowrap; transition:background .2s, color .2s}
.sw-b .si{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:var(--t50); color:var(--t600)}
.sw-b:hover{color:var(--ink); background:var(--surface)}
.sw-b[aria-current="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--sh-1)}
.sw-b[aria-current="true"] .si{background:var(--t600); color:var(--n0)}
.sw-b.luego{border:1.5px dashed var(--line-2); opacity:.85}
.sw-b.luego .ph{display:none}
.sw-b .bd, .ib .bd{position:absolute; top:0; left:22px; min-width:19px; height:19px; padding:0 5px; border-radius:10px; background:var(--r500); color:#fff; font-size:11px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2px var(--surface)}
.tools{margin-left:auto; display:flex; align-items:center; gap:8px; flex:none}
.tbtn{height:38px; padding:0 13px; border-radius:12px; display:inline-flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); transition:background .15s, border-color .15s}
.tbtn:hover{border-color:var(--g400); background:var(--g25)}
.tbtn.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.ib{position:relative; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:var(--muted); border:1.5px solid var(--line); background:var(--surface)}
.ib:hover{background:var(--g25); color:var(--g600); border-color:var(--g200)}
.me{display:flex; align-items:center; gap:9px; padding:3px 10px 3px 3px; border-radius:13px}
.av{width:34px; height:34px; border-radius:11px; background:linear-gradient(145deg, var(--b500), var(--b700)); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12.5px; flex:none}
.av.sm{width:26px; height:26px; border-radius:9px; font-size:10.5px}
.av.g{background:linear-gradient(145deg, var(--g500), var(--g600))}
.av.a{background:linear-gradient(145deg, var(--a500), var(--a700))}
.av.v{background:linear-gradient(145deg, var(--v500), #4b3aa8)}
.me b{display:block; font-size:13.5px; line-height:1.2}
.me small{display:block; font-size:11.5px; color:var(--muted)}
.main{flex:1; overflow-y:auto; min-height:0; background:var(--bg)}
.view{animation:vin .25s var(--ease)}
@keyframes vin{from{opacity:0}}

/* ===== App layout ===== */
.oapp{display:grid; grid-template-columns:244px minmax(0,1fr); min-height:100%}
.sb{position:sticky; top:0; align-self:start; height:calc(100vh - 64px); padding:18px 12px; border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; gap:3px; overflow-y:auto}
.sb-sec{font-size:11.5px; font-weight:700; color:var(--faint); margin:16px 12px 6px; text-transform:uppercase; letter-spacing:.04em}
.sb-sec:first-child{margin-top:2px}
.nav{display:flex; align-items:center; gap:11px; width:100%; min-height:42px; padding:0 10px; border-radius:13px; font-size:14px; font-weight:600; color:var(--muted); text-align:left}
.nav .ni{width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:var(--n50)}
.nav:hover{background:var(--g25); color:var(--ink)}
.nav[aria-current="true"]{background:var(--g50); color:var(--g700)}
.nav[aria-current="true"] .ni{background:var(--g600); color:var(--on-g)}
.nav .cnt{margin-left:auto; min-width:21px; height:21px; padding:0 7px; border-radius:11px; background:var(--r500); color:#fff; font-size:11.5px; font-weight:700; display:grid; place-items:center}
.nav .cnt.soft{background:var(--n100); color:var(--muted)}
.sb-foot{margin-top:auto; padding:12px; border-radius:16px; background:var(--n25); border:1px solid var(--line); font-size:12.5px; color:var(--muted)}
.sb-foot b{color:var(--ink); display:block; font-size:13px}
.op{padding:26px 30px 70px; min-width:0}
.op-h{display:flex; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.op-h h1{font-size:27px; letter-spacing:-.03em}
.op-h p{color:var(--muted); font-size:14.5px; margin-top:2px; max-width:70ch}
.op-h .acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.phase-ban{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:18px; background:var(--v50); border:1.5px dashed var(--v100); margin-bottom:18px; font-size:14px}
.phase-ban b{display:block}
.phase-ban .pi{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--surface); color:var(--v500); flex:none}
.note{padding:12px 14px; border-radius:14px; background:var(--n25); border:1px solid var(--line); font-size:13.5px; color:var(--muted)}
.note b{color:var(--ink)}

/* ===== Stats as filters ===== */
.stats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.stat{display:flex; flex-direction:column; align-items:flex-start; padding:9px 14px; border-radius:15px; background:var(--surface); border:1.5px solid var(--line); min-width:118px; text-align:left; transition:border-color .15s, background .15s}
.stat:hover{border-color:var(--line-2)}
.stat small{font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap}
.stat b{font-size:21px; font-weight:800; letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums}
.stat.red b{color:var(--r500)} .stat.amber b{color:var(--a700)} .stat.green b{color:var(--g600)} .stat.blue b{color:var(--b500)}
.stat[aria-pressed="true"]{border-color:var(--ink); background:var(--n25); box-shadow:inset 0 0 0 1px var(--ink)}
.showing{font-size:13px; color:var(--muted); margin:-6px 0 12px}
.showing button{color:var(--g600); font-weight:700; margin-left:6px}

/* ===== Buttons and pills ===== */
.btn{white-space:nowrap; height:36px; padding:0 14px; border-radius:12px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:background .15s, border-color .15s, color .15s}
.btn.pri{background:var(--g600); color:var(--on-g)}
.btn.pri:hover{background:var(--g700)}
.btn.sec{background:var(--surface); border:1.5px solid var(--line-2)}
.btn.sec:hover{border-color:var(--g400); background:var(--g25)}
.btn.warn{background:var(--a50); color:var(--a700); border:1.5px solid var(--a100)}
.btn.dang{background:var(--surface); color:var(--r500); border:1.5px solid var(--r100)}
.btn.dang:hover{background:var(--r25)}
.btn.ghost{color:var(--g600); padding:0 8px}
.btn.ghost:hover{background:var(--g50)}
.btn.sm{height:30px; padding:0 11px; font-size:12.5px; border-radius:10px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:9px; white-space:nowrap; background:var(--n50); color:var(--muted); width:max-content}
.pill.red{background:var(--r50); color:var(--r500)} .pill.amber{background:var(--a50); color:var(--a700)} .pill.green{background:var(--g50); color:var(--g600)}
.pill.blue{background:var(--b50); color:var(--b500)} .pill.violet{background:var(--v50); color:var(--v500)} .pill.ink{background:var(--ink); color:var(--surface)}
.pill.dot::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.pill.blink::before{animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.chipt{display:inline-flex; align-items:center; font-size:12px; font-weight:600; padding:2px 8px; border-radius:8px; background:var(--n50); color:var(--ink); white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}

/* ===== Lists ===== */
.search{position:relative; display:flex; align-items:center}
.search svg{position:absolute; left:11px; color:var(--faint); pointer-events:none}
.search input{width:260px; height:36px; padding:0 12px 0 34px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); font-size:13.5px}
.search input:focus{outline:none; border-color:var(--g400)}
.toolbar{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.toolbar .sp{flex:1}
.grp{margin-bottom:18px}
.grp-h{display:flex; align-items:center; gap:8px; padding:0 4px 8px; font-size:13px; font-weight:700; color:var(--muted)}
.grp-h .n{font-size:11.5px; background:var(--n100); padding:1px 8px; border-radius:9px}
.grp-h i{width:9px; height:9px; border-radius:3px; background:var(--n300)}
.rows{border-radius:18px; background:var(--surface); border:1px solid var(--line); overflow:hidden}
.row{display:grid; align-items:center; gap:14px; padding:12px 16px; border-top:1px solid var(--line); cursor:pointer; transition:background .12s}
.row:first-child{border-top:0}
.row:hover{background:var(--g25)}
.row.head{cursor:default; font-size:11.5px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; padding:9px 16px; background:var(--n25)}
.row.head:hover{background:var(--n25)}
.row .t b{display:block; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .t small{display:block; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .cell{font-size:13px; min-width:0}
.row .cell small{display:block; color:var(--muted); font-size:12px}
.row.closed{opacity:.72}
.row.alert{background:var(--r25)}
.row.alert:hover{background:var(--r50)}
.qpos{width:30px; height:30px; border-radius:10px; display:grid; place-items:center; font-size:12px; font-weight:800; background:var(--n50); color:var(--muted)}
.qpos.hot{background:var(--r500); color:#fff}
.empty{padding:34px 20px; text-align:center; color:var(--muted); border-radius:18px; border:1.5px dashed var(--line-2); background:var(--surface)}
.hl{animation:hl 2.4s var(--ease)}
@keyframes hl{0%,50%{box-shadow:0 0 0 3px var(--a400) inset; background:var(--a25)}}

/* ===== Cards ===== */
.card{padding:16px 18px; border-radius:18px; background:var(--surface); border:1px solid var(--line); margin-bottom:12px}
.card h3{font-size:15.5px; margin-bottom:8px; display:flex; align-items:center; gap:8px}
.card h3 .r{margin-left:auto; display:flex; gap:6px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
.grid4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.kv{display:flex; flex-direction:column; gap:2px; padding:11px 13px; border-radius:14px; background:var(--n25); border:1px solid var(--line); min-width:0}
.kv small{font-size:11.5px; color:var(--muted); font-weight:600}
.kv b{font-size:14.5px; font-weight:700}
.kv .sub{font-size:12px; color:var(--muted)}
.kv.click{cursor:pointer; text-align:left}
.kv.click:hover{border-color:var(--g200); background:var(--g25)}
.big{font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1.1}

/* ===== Record page (ficha) ===== */
.crumb{display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--faint); margin-bottom:10px}
.crumb button{color:var(--muted); font-weight:600; border-radius:8px; padding:2px 6px; margin-left:-6px}
.crumb button:hover{background:var(--g50); color:var(--g700)}
.crumb span{color:var(--ink); font-weight:600}
.rh{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:14px}
.rh h1{font-size:26px; letter-spacing:-.03em; line-height:1.15}
.rh p{color:var(--muted); margin-top:4px}
.rh .pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.rh .acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.nextstep{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:var(--g25); border:1px solid var(--g100); margin-bottom:16px}
.nextstep .ic{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--g600); color:var(--on-g); flex:none}
.nextstep b{display:block; font-size:14px}
.nextstep small{display:block; color:var(--muted); font-size:12.5px}
.nextstep .acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.nextstep.amber{background:var(--a25); border-color:var(--a100)} .nextstep.amber .ic{background:var(--a500); color:var(--a900)}
.nextstep.red{background:var(--r25); border-color:var(--r100)} .nextstep.red .ic{background:var(--r500); color:#fff}
.nextstep.grey{background:var(--n25); border-color:var(--line)} .nextstep.grey .ic{background:var(--n300); color:var(--ink)}
.slas{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:16px}
.sla{padding:10px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.sla small{display:block; font-size:11.5px; color:var(--muted); font-weight:600}
.sla b{display:block; font-size:13.5px; margin-top:2px}
.sla .pill{margin-top:5px}
.jtabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto}
.jtabs button{display:flex; align-items:center; gap:7px; padding:10px 14px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1px; white-space:nowrap}
.jtabs button:hover{color:var(--ink)}
.jtabs button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--g500)}
.jtabs span{font-size:11.5px; font-weight:700; padding:1px 7px; border-radius:9px; background:var(--n50); color:var(--muted)}
.jtabs span.red{background:var(--r500); color:#fff}

/* ===== Issue and traceback ===== */
.issue{padding:16px 18px; border-radius:18px; background:var(--surface); border:1px solid var(--line); margin-bottom:14px}
.issue-h{display:flex; align-items:flex-start; gap:10px}
.issue-h b{font-size:15px}
.issue-h .r{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.issue p.q{margin-top:6px; font-size:14px}
.issue .loc{font-size:12.5px; color:var(--muted); margin-top:3px}
.ai{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--v25); border:1px solid var(--v100); font-size:13.5px}
.ai .h{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--v500); margin-bottom:5px}
.ai .h .r{margin-left:auto}
.ai ul{margin:6px 0 0; padding-left:18px}
.trace{margin-top:12px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border-radius:14px; border:1px solid var(--line); overflow:hidden}
.trace > div{padding:10px 12px; border-left:1px solid var(--line); position:relative; min-width:0}
.trace > div:first-child{border-left:0}
.trace small{display:block; font-size:11px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.04em}
.trace b{display:block; font-size:13.5px; margin-top:2px}
.trace .sub{font-size:12px; color:var(--muted)}
.trace .ok{background:var(--g25)} .trace .risk{background:var(--a25)} .trace .bad{background:var(--r25)}
.mrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px dashed var(--line); font-size:13px}
.mrow:first-child{border-top:0}
.decide{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--n25); border:1px solid var(--line)}
.decide .opts{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0}
.seg{height:32px; padding:0 12px; border-radius:10px; font-size:13px; font-weight:600; border:1.5px solid var(--line-2); background:var(--surface)}
.seg[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.shots{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.shot{width:74px; height:56px; border-radius:10px; overflow:hidden; background:var(--n100); display:grid; place-items:center; color:var(--faint); font-size:10.5px; text-align:center; position:relative}
.shot svg.ph{position:absolute; inset:0; width:100%; height:100%}
.shot span{position:relative; background:rgba(0,0,0,.45); color:#fff; padding:1px 5px; border-radius:6px; font-size:10px; align-self:end; margin-bottom:4px}
.files{display:flex; flex-direction:column; gap:6px}
.file{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; background:var(--n25); border:1px solid var(--line); font-size:13px}
.file .fi{width:30px; height:30px; border-radius:9px; background:var(--b50); color:var(--b500); display:grid; place-items:center}
.file small{color:var(--muted); display:block; font-size:11.5px}
.upl{display:inline-flex; align-items:center; gap:7px; cursor:pointer}
.upl input{display:none}

/* ===== Timeline ===== */
.tl{list-style:none; margin:0; padding:0; position:relative}
.tl::before{content:""; position:absolute; left:15px; top:6px; bottom:6px; width:2px; background:var(--line)}
.tl li{position:relative; display:flex; gap:12px; padding-bottom:14px}
.tl .d{width:32px; height:32px; border-radius:11px; display:grid; place-items:center; background:var(--t50, var(--n50)); color:var(--t600, var(--muted)); flex:none; z-index:1; box-shadow:0 0 0 4px var(--bg)}
.tl .x{font-size:13.5px; padding-top:5px}
.tl time{display:block; font-size:12px; color:var(--faint)}

/* ===== Messages ===== */
.msg{padding:12px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line); margin-bottom:10px}
.msg .h{display:flex; align-items:center; gap:8px; font-size:13px}
.msg .h b{font-size:13.5px}
.msg .h .r{margin-left:auto; display:flex; gap:6px; align-items:center}
.msg pre{white-space:pre-wrap; font-family:var(--f); font-size:13.5px; margin:8px 0 0; color:var(--ink)}
.compose{padding:14px; border-radius:16px; background:var(--surface); border:1px solid var(--line); margin-bottom:14px}
.fld{width:100%; min-height:38px; padding:8px 12px; border-radius:11px; border:1.5px solid var(--line-2); background:var(--surface); font-size:14px}
textarea.fld{min-height:150px; resize:vertical; line-height:1.45}
.fld:focus{outline:none; border-color:var(--g500); box-shadow:0 0 0 3px var(--g50)}
.lbl{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:10px 0 5px}
.lbl em{font-style:normal; color:var(--r500)}
.frow{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.frow3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}

/* ===== Picker, calendar, modal ===== */
.pk{position:relative}
.pk-b{display:flex; align-items:center; gap:8px; width:100%; min-height:38px; padding:6px 12px; border-radius:11px; border:1.5px solid var(--line-2); background:var(--surface); font-size:14px; text-align:left}
.pk-b:hover{border-color:var(--g400)}
.pk-b .ph2{color:var(--faint)}
.pk-b svg{margin-left:auto; color:var(--faint)}
.pop{position:fixed; z-index:80; width:340px; max-height:360px; display:flex; flex-direction:column; border-radius:16px; background:var(--surface); border:1px solid var(--line-2); box-shadow:var(--sh-3); overflow:hidden}
.pop input{border:0; border-bottom:1px solid var(--line); padding:12px 14px; font-size:14px; background:var(--surface); outline:none}
.pop .ol{overflow-y:auto; padding:6px}
.pop .og{font-size:11px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.04em; padding:8px 10px 4px}
.opt{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:10px; font-size:13.5px; text-align:left; white-space:nowrap}
.opt:hover, .opt.kb{background:var(--g25)}
.opt span{overflow:hidden; text-overflow:ellipsis}
.opt small{margin-left:auto; color:var(--muted); font-size:12px; padding-left:10px}
.opt[aria-selected="true"]{background:var(--g50); font-weight:700}
.cal{padding:12px; width:300px}
.cal .ch{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-weight:700}
.cal .ch button{width:30px; height:30px; border-radius:9px; display:grid; place-items:center}
.cal .ch button:hover{background:var(--n50)}
.cal .cg{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center}
.cal .cg span{font-size:11px; color:var(--faint); font-weight:700; padding:4px 0}
.cal .cg button{height:34px; border-radius:9px; font-size:13px}
.cal .cg button:hover{background:var(--g25)}
.cal .cg button.td{box-shadow:inset 0 0 0 1.5px var(--g400)}
.cal .cg button.sel{background:var(--g600); color:var(--on-g); font-weight:700}
.cal .cg button.out{color:var(--faint)}
.cal .cf{display:flex; gap:6px; margin-top:8px}
.scrim{position:fixed; inset:0; z-index:60; background:rgba(19,26,23,.38); display:grid; place-items:center; padding:20px; animation:vin .2s}
.modal{width:min(640px,100%); max-height:calc(100vh - 40px); display:flex; flex-direction:column; border-radius:22px; background:var(--surface); box-shadow:var(--sh-3); overflow:hidden}
.modal.wide{width:min(860px,100%)}
.modal .mh{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line)}
.modal .mh b{font-size:17px}
.modal .mh small{display:block; color:var(--muted); font-size:12.5px}
.modal .mh .x{margin-left:auto; width:36px; height:36px; border-radius:11px; display:grid; place-items:center; border:1px solid var(--line)}
.modal .mb{padding:14px 20px 18px; overflow-y:auto}
.modal .mf{display:flex; gap:8px; justify-content:flex-end; padding:12px 20px; border-top:1px solid var(--line); background:var(--n25); align-items:center}
.modal .mf .l{margin-right:auto; font-size:12.5px; color:var(--muted)}
.steps{display:flex; gap:6px; margin-bottom:12px}
.steps i{flex:1; height:5px; border-radius:3px; background:var(--n100)}
.steps i.on{background:var(--g500)}
.tchips{display:flex; flex-wrap:wrap; gap:7px}
.tchip{display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px; border-radius:11px; border:1.5px solid var(--line-2); background:var(--surface); font-size:13px; font-weight:600}
.tchip small{color:var(--muted); font-weight:600}
.tchip[aria-pressed="true"]{background:var(--g600); border-color:var(--g600); color:var(--on-g)}
.tchip[aria-pressed="true"] small{color:var(--on-g); opacity:.8}
.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,16px); z-index:95; padding:11px 16px; border-radius:16px; background:var(--ink); color:var(--surface); font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px; opacity:0; pointer-events:none; transition:.28s var(--ease); box-shadow:var(--sh-3); max-width:calc(100% - 28px)}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ===== Email preview ===== */
.mail{border-radius:16px; border:1px solid var(--line); overflow:hidden; background:var(--surface)}
.mail .mh2{padding:10px 14px; background:var(--n25); border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted)}
.mail .mh2 b{color:var(--ink)}
.mail .mb2{padding:14px; font-size:14px; white-space:pre-wrap}
.mail .cta{display:inline-block; margin-top:10px; padding:9px 16px; border-radius:11px; background:var(--g600); color:var(--on-g); font-weight:700}

/* ===== Phone ===== */
.phone-stage{display:grid; place-items:center; padding:10px 0 20px}
.phone{width:380px; height:740px; border-radius:48px; padding:10px; background:#131A17; box-shadow:var(--sh-3); position:relative}
.screen{height:100%; border-radius:39px; overflow:hidden; background:var(--bg); display:flex; flex-direction:column; position:relative}
.notch{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:96px; height:26px; border-radius:15px; background:#131A17; z-index:6}
.p-top{flex:none; padding:44px 20px 12px; background:var(--surface); border-bottom:1px solid var(--line)}
.p-top small{display:block; color:var(--muted); font-size:12.5px}
.p-top b{display:block; font-size:20px; font-weight:800; letter-spacing:-.02em}
.p-body{flex:1; overflow-y:auto; padding:14px 16px 24px}
.pc{display:block; width:100%; text-align:left; padding:13px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--line); margin-bottom:10px}
.pc b{display:block; font-size:15px}
.pc small{display:block; font-size:12.5px; color:var(--muted)}
.p-foot{flex:none; padding:10px 16px 18px; background:var(--surface); border-top:1px solid var(--line)}
.go{width:100%; height:50px; border-radius:16px; background:var(--g600); color:var(--on-g); font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px}
.go:disabled{background:var(--n100); color:var(--faint)}
.bigopt{display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:10px 12px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); font-size:14.5px; font-weight:600; margin-bottom:8px; text-align:left}
.bigopt[aria-pressed="true"]{border-color:var(--g500); background:var(--g25)}

/* ===== Week ===== */
.week{display:grid; grid-template-columns:150px repeat(5,minmax(0,1fr)); border-radius:18px; border:1px solid var(--line); overflow:hidden; background:var(--surface)}
.week > div{border-left:1px solid var(--line); border-top:1px solid var(--line); padding:8px; min-height:92px}
.week .wh{min-height:0; font-size:12px; font-weight:700; color:var(--muted); background:var(--n25); text-align:center}
.week .wh.td{color:var(--g600)}
.week .wp{font-size:13px; font-weight:700; background:var(--n25)}
.week .wp small{display:block; color:var(--muted); font-weight:500; font-size:11.5px}
.wv{display:block; width:100%; text-align:left; padding:6px 8px; border-radius:10px; background:var(--t50); color:var(--ink); font-size:12px; margin-bottom:5px; border-left:3px solid var(--t600)}
.wv b{display:block; font-size:12px}

/* ===== KPIs ===== */
.kpi{display:flex; flex-direction:column; gap:4px; padding:14px 16px; border-radius:18px; background:var(--surface); border:1px solid var(--line); text-align:left; min-width:0}
.kpi:hover{border-color:var(--g200)}
.kpi small{font-size:12.5px; color:var(--muted); font-weight:600}
.kpi b{font-size:26px; font-weight:800; letter-spacing:-.03em}
.kpi .sub{font-size:12px; color:var(--muted)}
.bar{height:8px; border-radius:5px; background:var(--n100); overflow:hidden}
.bar i{display:block; height:100%; background:var(--g500); border-radius:5px}
.bar i.a{background:var(--a500)} .bar i.r{background:var(--r500)}

/* ===== Help and data ===== */
.help-intro{padding:18px 20px; border-radius:20px; background:linear-gradient(120deg, var(--g25), var(--surface) 70%); border:1px solid var(--line); margin-bottom:16px}
.help-intro .who{font-size:13px; color:var(--g600); font-weight:700}
.flow{display:flex; flex-direction:column; gap:8px; margin:14px 0}
.flow div{display:flex; gap:12px; align-items:flex-start; padding:10px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); font-size:14px}
.flow i{width:26px; height:26px; border-radius:9px; background:var(--g600); color:var(--on-g); display:grid; place-items:center; font-style:normal; font-weight:800; font-size:12.5px; flex:none}
.hv{padding:14px 16px; border-radius:18px; background:var(--surface); border:1px solid var(--line); margin-bottom:10px}
.hv .h{display:flex; align-items:center; gap:10px}
.hv .h b{font-size:15px}
.hv .h .btn{margin-left:auto}
.hv ul{margin:8px 0 0; padding-left:18px; color:var(--muted); font-size:13.5px}
.rel{display:flex; gap:10px; flex-wrap:wrap}
.rel button{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); font-size:13.5px; text-align:left}
.rel button:hover{border-color:var(--g200)}
.dbw{padding:26px 30px 70px}
.az{display:flex; flex-direction:column; gap:16px}
.azs h3{font-size:16px; margin-bottom:8px}
.azr{display:grid; grid-template-columns:150px minmax(0,1fr) 260px; gap:12px; align-items:center; padding:10px 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line); margin-bottom:6px; font-size:13.5px; cursor:pointer}
.azr:hover{border-color:var(--g200)}
.dbg{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px}
.dbc{padding:14px 16px; border-radius:18px; background:var(--surface); border:1px solid var(--line); text-align:left}
.dbc.ex{border-style:dashed}
.dbc h4{font-size:15px; display:flex; gap:8px; align-items:center}
.dbc p{font-size:12.5px; color:var(--muted); margin:4px 0 8px}
.dbc .f{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-top:1px dashed var(--line)}
.dbc .f span:last-child{color:var(--muted)}
.mx{border-collapse:collapse; width:100%; background:var(--surface); border-radius:16px; overflow:hidden; font-size:13px}
.mx th,.mx td{border:1px solid var(--line); padding:7px 9px; text-align:center}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx td.w{background:var(--g50); color:var(--g600); font-weight:700}
.mx td.r{background:var(--b25); color:var(--b500)}

/* ===== Tour ===== */
.tourp{position:fixed; z-index:70; right:20px; bottom:20px; width:400px; max-width:calc(100% - 24px); border-radius:20px; background:var(--surface); border:1px solid var(--line-2); box-shadow:var(--sh-3); overflow:hidden}
.tourp .th{display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--ink); color:var(--surface); cursor:move; user-select:none}
.tourp .th b{font-size:13.5px}
.tourp .th small{opacity:.7; font-size:12px}
.tourp .th .r{margin-left:auto; display:flex; gap:4px}
.tourp .th button{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:var(--surface)}
.tourp .th button:hover{background:rgba(255,255,255,.14)}
.tourp .tb{padding:12px 16px; max-height:52vh; overflow-y:auto; font-size:13.5px}
.tourp .tb h4{font-size:16px; margin-bottom:6px}
.tourp .why{padding:9px 11px; border-radius:12px; background:var(--a25); border:1px solid var(--a100); margin-bottom:8px}
.tourp .say{padding:9px 11px; border-radius:12px; background:var(--g25); border:1px solid var(--g100); margin-top:8px}
.tourp ul{margin:4px 0; padding-left:18px}
.tourp .tf{display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}
.tourp .dots{display:flex; gap:4px; flex:1; flex-wrap:wrap}
.tourp .dots button{width:9px; height:9px; border-radius:50%; background:var(--n200)}
.tourp .dots button.on{background:var(--g500); width:20px; border-radius:5px}
.tourp.col .tb, .tourp.col .tf{display:none}
.tourp .tlist button{display:flex; gap:8px; width:100%; text-align:left; padding:7px 8px; border-radius:10px; font-size:13px}
.tourp .tlist button:hover{background:var(--n50)}
.tourp .tlist button.on{background:var(--g50); font-weight:700}

@media (max-width:1480px){ .me div{display:none} .tbtn{padding:0 11px} }
@media (max-width:1100px){ .slas{grid-template-columns:repeat(3,1fr)} .grid4{grid-template-columns:repeat(2,1fr)} .trace{grid-template-columns:repeat(2,1fr)} }
@media (max-width:900px){
  .top{height:auto; padding:10px 12px; flex-wrap:wrap; row-gap:8px}
  .brand small,.me div{display:none}
  .appsw{order:3; width:100%}
  .oapp{grid-template-columns:1fr}
  .sb{position:static; height:auto; flex-direction:row; padding:8px 10px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto}
  .sb-sec,.sb-foot{display:none}
  .nav{width:auto; white-space:nowrap}
  .op,.dbw{padding:18px 14px 70px}
  .grid2,.grid3,.frow,.frow3{grid-template-columns:1fr}
  .slas{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr!important}
  .row.head{display:none}
  .phone{width:100%; max-width:380px}
  .week{grid-template-columns:100px repeat(5,minmax(120px,1fr)); overflow-x:auto}
}


/* calendar month, legend, trade parents */
.month{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-radius:18px; border:1px solid var(--line); overflow:hidden; background:var(--surface)}
.month > div{border-left:1px solid var(--line); border-top:1px solid var(--line); padding:6px; min-height:104px; min-width:0}
.month .mh{min-height:0; font-size:12px; font-weight:700; color:var(--muted); background:var(--n25); text-align:center; padding:8px 6px}
.month .md.out{background:var(--n25)}
.month .md .dn{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px}
.month .md.td .dn{color:var(--g600)}
.month .md.td{background:var(--g25)}
.month .wv{padding:4px 6px; font-size:11px; margin-bottom:4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.month .wv b{font-size:11px; overflow:hidden; text-overflow:ellipsis}
.month .wv br, .month .wv .muted{display:none}
.month .more{font-size:11px; color:var(--muted); font-weight:600}
.wv.tdue{background:transparent; border:1.5px dashed var(--a400, #E0A43A); border-left-width:3px; color:var(--ink)}
.lg{display:inline-block; width:10px; height:10px; border-radius:3px; margin:0 4px 0 10px; vertical-align:-1px; background:var(--t50); border-left:3px solid var(--t600)}
.lg.tdue{background:transparent; border:1.5px dashed var(--a400, #E0A43A)}
.row.trow{background:var(--n25); cursor:pointer}
.row.trow:hover{background:var(--g25)}
.row.trow .chev{color:var(--muted); display:grid; place-items:center}
.row.child{background:var(--surface)}
.row.child .t{padding-left:14px; border-left:2px solid var(--line)}
/* operator tips */
.tbtn.tipon{background:var(--a25); border-color:var(--a100); color:var(--a700)}
.tip-ring{position:fixed; z-index:68; border-radius:12px; border:2px solid var(--g500); box-shadow:0 0 0 4px rgba(34,160,90,.22), 0 0 0 9999px rgba(12,22,17,.26); pointer-events:none; transition:left .18s var(--ease), top .18s var(--ease), width .18s var(--ease), height .18s var(--ease)}
.tip-ring.in-modal{box-shadow:0 0 0 4px rgba(34,160,90,.25)}
.tipb{position:fixed; z-index:76; background:var(--surface); color:var(--ink); border:1px solid var(--line-2); border-radius:16px; box-shadow:var(--sh-3); padding:13px 14px 11px; font-size:13.5px; line-height:1.45; animation:tipin .2s var(--ease)}
@keyframes tipin{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}

/* ===== WALKTHROUGH ===== */
const ensureMay = () => { S.user = 'may'; if (DAY.may.st !== 'started') { startDay('may'); } };

const TOUR = [
  {t: 'Andrew owns the morning', min: 2,
    dolor: 'Andrew: today the dialer works, but he cannot get in, cannot set the assignment rules and cannot see transcripts. 6,000 to 8,000 properties with no construction started, and only 110 in the pipeline in the Palisades.',
    show: ['At 7:00 AM the engine built every list with his rules: three reps, an even share each, and follow-ups back with the rep who set them.', 'Same house, two reps: 0. A property and all its contacts stay with one rep for the day.', 'Each card shows how far the rep is, with calls, connects, conversations and leads.'],
    say: 'This is yours: the rules, the lists and the numbers, without depending on the dialer vendor.',

  {t: 'One call, one lead for sales', min: 2,
    dolor: 'The rep does not close: the job is to find interest and pass it to the internal team.',
    show: ['Elena Marsh: permit issued in August. Call, then pick Interested: the box shows what will happen before saving.', 'Save: the property becomes a Potential Lead and lands in Hand-offs and in the AB Leads board in monday, with the call history.', 'David Marsh leaves the list: the house is with sales now.'],
    say: 'Interest found today is in the sales team’s board today.',

  {t: 'One no clears the whole house', min: 2,

  {t: 'Nothing falls through the cracks', min: 2,

    show: ['Henry Okafor: Wrong Number with a single phone puts him on hold for a new number instead of losing him.', 'A Left VM comes back in 3 business days to any rep; Not Contacted the next business day.', 'When the list has a result for every contact, Request more checks it and adds the next batch.'],
    say: 'Every contact has a next date or a reason, so the whole base gets worked.',

    show: ['Rules: allocation size, waiting time by result, max attempts. Change one and the next allocation uses it.', 'Performance: the rates by rep from the call log.', 'Daily emails: the rep’s campaign in the morning and the report to management at night.'],
    say: 'When the rules change, Andrew changes them.',
    go: () => { go('mgr', 'rules'); }},
  {t: 'What phase 2 adds', min: 1,

    show: ['With the provider AB picks, calls are logged by themselves: verified for bonuses.', 'With the transcript, the AI writes the summary and suggests the result and the follow-up.', 'Enrich finds numbers for contacts on hold; new audiences come in by trigger.'],
    say: 'Phase 1 runs without the provider; phase 2 plugs it in.',
    go: () => { go('p2', 'call'); }}
];
const TOUR_MAS = [
  ['Contact pool: why each contact is or is not in today’s lists', () => { S.f.pool = 'all'; go('mgr', 'pool'); }],
  ['Reassign what a rep has not called', () => { go('mgr', 'live'); A.reassign('dan'); }],
  ['905 Arbolada Way: the property record with its three contacts', () => { openProp(pB.k, 'cts'); }],
  ['Daily emails: the rep’s morning campaign', () => { S.f.mail = 'rep'; go('mgr', 'mail'); }],
  ['monday sync: what was pushed today', () => { go('mgr', 'sync'); }],

  ['Data: the process from A to Z and where it runs', () => { S.f.dbm = 'az'; go('db'); S.view = 'db'; }]
];
function renderTour() {
  const w = $('#tourw'), t = S.tour;
  if (!t.on) { w.innerHTML = ''; return; }
  const st = TOUR[t.i], tot = TOUR.reduce((a, x) => a + x.min, 0);
  const pos = t.x != null ? `left:${Math.max(8, Math.min(t.x, innerWidth - 120))}px;top:${Math.max(8, Math.min(t.y, innerHeight - 60))}px;right:auto;bottom:auto` : '';
  let body;
  if (t.list) body = `<div class="tb"><div class="tlist">${TOUR.map((x, i) => `<button data-act="tourto" data-v="${i}" class="${i === t.i ? 'on' : ''}"><span class="muted">${i + 1}</span><span style="flex:1">${esc(x.t)}</span><span class="muted">${x.min} min</span></button>`).join('')}</div><div class="sb-sec" style="padding:10px 8px 4px">If there is time</div><div class="tlist">${TOUR_MAS.map(([x], i) => `<button data-act="tourgo" data-v="${i}"><span class="muted">+</span><span style="flex:1">${esc(x)}</span></button>`).join('')}</div></div>`;

function tourShow(i) { S.tour.i = i; S.tour.list = false; S.tour.col = false; S.modal = null; S.pop = null; TOUR[i].go(); }

function dispatch(el, e) {
  const act = el.dataset.act, fn = A[act];
  if (!fn) { console.warn('No action', act); return; }
  if (S.pop && act !== 'pick' && act !== 'cal' && act !== 'calnav' && act !== 'pickset' && act !== 'calpick') S.pop = null;

  if (!el) {
    if (S.pop && !e.target.closest('.pop')) { S.pop = null; renderLayer(); }
    return;
  }
  if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  if (el.tagName === 'A') e.preventDefault();

  dispatch(el, e);

document.addEventListener('input', e => {

  if (!fn) return;
  fn(el.value, rest.join('.'));
  if (S.modal && el.closest('#layer')) {
    const f = $('#layer .mf'), m = MODALS[S.modal.k](S.modal);
    if (f && m.foot != null) f.innerHTML = m.foot;
  }
});
document.addEventListener('change', e => {
  const el = e.target;

  if (el.type === 'file' && el.dataset.up === 'imp') {
    if (el.files.length) toast(`${el.files[0].name} received. In the app it is matched by address and phone before loading`);
    el.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.pop) { S.pop = null; renderLayer(); return; }
    if (S.modal) { S.modal = null; render(); return; }
  }
  if (e.target.id === 'popq' && S.pop && S.pop.t === 'pick') {
    const btns = [...document.querySelectorAll('#layer .pop .opt')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      S.pop.kb = Math.max(0, Math.min(btns.length - 1, (S.pop.kb || 0) + (e.key === 'ArrowDown' ? 1 : -1)));
      btns.forEach((b, i) => b.classList.toggle('kb', i === S.pop.kb));
    }
    if (e.key === 'Enter' && btns[S.pop.kb || 0]) { e.preventDefault(); dispatch(btns[S.pop.kb || 0], e); }
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'emp') { e.preventDefault(); e.target.blur(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act]:not(button):not(input):not(textarea)')) { e.preventDefault(); dispatch(e.target, e); }
});
const empEl = $('#emp');
empEl.addEventListener('dblclick', () => { empEl.contentEditable = 'true'; empEl.focus(); const r = document.createRange(); r.selectNodeContents(empEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
empEl.addEventListener('blur', () => { if (empEl.contentEditable !== 'true') return; empEl.contentEditable = 'false'; const v = empEl.textContent.trim(); EMP = v || EMP0; store.set('emp', EMP); render(); });
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('#tourw [data-drag]');
  if (!h || e.target.closest('button')) return;
  const p = h.parentElement.getBoundingClientRect();

document.addEventListener('pointermove', e => {
  if (!drag) return;

  if (p) Object.assign(p.style, {left: S.tour.x + 'px', top: S.tour.y + 'px', right: 'auto', bottom: 'auto'});
});
document.addEventListener('pointerup', () => { drag = null; });
addEventListener('resize', () => { if (S.pop) { S.pop = null; renderLayer(); } });

/* ===== BOOT ===== */

(() => { const h = new URLSearchParams(location.hash.slice(1)); const v = h.get('vista'); if (v && (VIEWS[v] || v === 'db')) { S.view = v; if (h.get('pagina') && v !== 'db') S.page[v] = h.get('pagina'); } })();
