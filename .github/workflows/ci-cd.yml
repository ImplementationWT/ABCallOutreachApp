# CI/CD of the Call Center.
#   Every push and pull request: lint, typecheck, unit tests and build.
#   Push to main (or "Run workflow"): build the Docker image, push it to GitHub Container Registry and
#   deploy it to the VPS (outreach.arzumanbrothers.com) over SSH with a deploy-only key.
#
# Repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key of the deploy key),
# DEPLOY_KNOWN_HOSTS (ssh-keyscan of the host). The app's own settings (MONGODB_URI, MONGODB_DB) live in
# ~/outreach/.env on the VPS.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/implementationwt/abcalloutreachapp

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - run: npm run build

  image:
    name: Docker image
    needs: checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VPS
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://outreach.arzumanbrothers.com
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the compose file
        run: |
          ssh -i ~/.ssh/deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'mkdir -p ~/outreach'
          scp -i ~/.ssh/deploy deploy/docker-compose.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:outreach/docker-compose.yml
      - name: Pull and restart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job's short-lived token is used to pull, then the server logs out of the registry
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null && cd ~/outreach && TAG=${{ github.sha }} docker compose pull && TAG=${{ github.sha }} docker compose up -d --remove-orphans; s=\$?; docker logout ghcr.io >/dev/null; exit \$s"
      - name: Check it answers
        run: |
          ssh -i ~/.ssh/deploy ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            for i in $(seq 1 30); do
              if docker exec outreach-app wget -qO- http://127.0.0.1:3000/api/health/db 2>/dev/null | grep -q "\"ok\":true"; then echo "App and database OK"; ok=1; break; fi
              sleep 2
            done
            docker image prune -f --filter "label=org.opencontainers.image.source" >/dev/null 2>&1 || true
            [ "$ok" = 1 ] || { docker logs --tail 50 outreach-app; exit 1; }'
